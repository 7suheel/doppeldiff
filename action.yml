name: doppeldiff behavioral diff
description: 'Catch silent behavior changes in PRs: runs old and new code on generated inputs and comments every difference.'
author: 7suheel
branding:
  icon: git-pull-request
  color: purple

inputs:
  mode:
    description: 'auto (default: analyze on pull_request, comment on workflow_run) | analyze | comment'
    default: auto
  github-token:
    description: Token for reading artifacts and posting the comment.
    default: ${{ github.token }}
  runs:
    description: Max generated inputs per function.
    default: '10000'
  time-budget:
    description: Total exploration time budget in seconds (split across functions).
    default: '60'
  timeout:
    description: Per-call timeout in milliseconds.
    default: '250'
  fail-on:
    description: 'Fail the analyze job on: never (default) | unclaimed | any'
    default: never
  include:
    description: Only analyze matching files (globs, comma or newline separated).
    default: ''
  exclude:
    description: Skip matching files (globs, comma or newline separated).
    default: ''
  install:
    description: Install dependencies (lifecycle scripts disabled) if node_modules is missing.
    default: 'true'
  llm:
    description: 'Optional LLM layer: off (default) | openai-compatible | anthropic | openai. Claim matching works without it.'
    default: 'off'
  llm-base-url:
    description: Base URL of an OpenAI-compatible endpoint (for llm openai-compatible), e.g. a self-hosted model.
    default: ''
  llm-api-key:
    description: Optional key for the OpenAI-compatible endpoint.
    default: ''
  anthropic-api-key:
    description: Optional, paid. Enables LLM claim matching (comment job) or input suggestions (analyze job).
    default: ''
  openai-api-key:
    description: Optional alternative to anthropic-api-key.
    default: ''
  llm-model:
    description: Optional model override for the LLM layer.
    default: ''
  artifact-name:
    description: Name of the report artifact passed from the analyze job to the comment job.
    default: doppeldiff-report

outputs:
  verdict:
    description: 'no-change | changes | unclaimed'
    value: ${{ steps.run.outputs.verdict }}
  behaviors:
    description: Number of behavior changes found.
    value: ${{ steps.run.outputs.behaviors }}
  unclaimed:
    description: Number of behavior changes not covered by the PR description.
    value: ${{ steps.run.outputs.unclaimed }}
  report-path:
    description: Path of the JSON report (analyze mode).
    value: ${{ steps.run.outputs.report-path }}

runs:
  using: composite
  steps:
    - id: node
      shell: bash
      run: |
        if node -e 'const [a,b]=process.versions.node.split(".").map(Number);process.exit(a>22||(a===22&&b>=13)?0:1)' 2>/dev/null; then
          echo "setup=false" >> "$GITHUB_OUTPUT"
        else
          echo "setup=true" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.node.outputs.setup == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 22
    # Comment mode: fetch the report of the triggering analyze run. Artifacts are handled by the official
    # actions because composite `run:` steps do not receive the Actions runtime token.
    - id: download
      if: github.event_name == 'workflow_run' && inputs.mode != 'analyze'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/doppeldiff-download
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ inputs.github-token }}
    - shell: bash
      run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund --loglevel=error --prefix "$GITHUB_ACTION_PATH"
    - id: run
      shell: bash
      run: node "$GITHUB_ACTION_PATH/action/dist/main.js"
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_RUNS: ${{ inputs.runs }}
        INPUT_TIME-BUDGET: ${{ inputs.time-budget }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_FAIL-ON: ${{ inputs.fail-on }}
        INPUT_INCLUDE: ${{ inputs.include }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_INSTALL: ${{ inputs.install }}
        INPUT_ANTHROPIC-API-KEY: ${{ inputs.anthropic-api-key }}
        INPUT_OPENAI-API-KEY: ${{ inputs.openai-api-key }}
        INPUT_LLM-MODEL: ${{ inputs.llm-model }}
        INPUT_LLM: ${{ inputs.llm }}
        INPUT_LLM-BASE-URL: ${{ inputs.llm-base-url }}
        INPUT_LLM-API-KEY: ${{ inputs.llm-api-key }}
        INPUT_ARTIFACT-NAME: ${{ inputs.artifact-name }}
        INPUT_REPORT-DOWNLOAD-DIR: ${{ runner.temp }}/doppeldiff-download
    # Analyze mode: hand the report to the comment workflow (also when fail-on failed the step).
    - if: always() && steps.run.outputs.report-dir != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run.outputs.report-dir }}
        retention-days: 7
        if-no-files-found: error
