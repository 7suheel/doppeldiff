name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed, with npm provenance.
# Authentication: npm trusted publishing (OIDC, no token). See docs/RELEASING.md for the one-time setup;
# the very first publish of a new package name needs an npm token or a manual publish.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11
      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: action/dist is up to date
        run: npm run build:action && git diff --exit-code -- action/dist
      - name: Publish
        # With trusted publishing configured, no token is needed. NPM_TOKEN is only a fallback for the first
        # publish of a new package; remove the secret once trusted publishing is set up.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
