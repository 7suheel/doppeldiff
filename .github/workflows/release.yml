name: Release

# Publishes a version tag (v1.2.3) to npm, with provenance.
# - Runs when a tag is pushed (also when GitHub creates the tag while publishing a release), or manually from the
#   Actions tab: "Run workflow" → "Use workflow from" → Tags → the version tag. It refuses to run on a branch.
# - Authentication: the NPM_TOKEN secret when it exists, otherwise npm trusted publishing (OIDC). See docs/RELEASING.md.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing and the provenance signature
    steps:
      - name: Run on a version tag only
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::run this workflow on a version tag (Use workflow from → Tags), not on the branch $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no dependency cache in release builds (npm's recommendation)
      # Trusted publishing needs npm >= 11.5.1 (and Node >= 22.14).
      - run: npm install -g npm@11
      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Version is not on npm yet
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "doppeldiff@$version" version >/dev/null 2>&1; then
            echo "::error::doppeldiff@$version is already on npm"
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: action/dist is up to date
        run: npm run build:action && git diff --exit-code -- action/dist
      - name: package.json needs no corrections
        # npm silently "auto-corrects" package.json on publish, e.g. it drops a `bin` entry written as "./dist/cli.js".
        run: |
          npm publish --dry-run 2>&1 | tee publish-dry-run.log
          if grep -q "auto-corrected" publish-dry-run.log; then
            echo "::error::npm would change package.json on publish (see above); run npm pkg fix"
            exit 1
          fi
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Authenticating with the NPM_TOKEN secret"
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "No NPM_TOKEN secret: authenticating with npm trusted publishing (OIDC)"
            unset NODE_AUTH_TOKEN
            # setup-node's .npmrc refers to ${NODE_AUTH_TOKEN}; without a token npm must use OIDC only.
            npm config delete "//registry.npmjs.org/:_authToken" --location=user || true
          fi
          npm publish --provenance --access public
