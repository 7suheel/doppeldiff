# Dogfooding, part 1 of 2: runs doppeldiff on pull requests, using the action from this repository.
# Runs the pull request's code: no secrets, read-only token.
name: doppeldiff

on:
  pull_request:

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
